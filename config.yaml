# ========================================================
# Jovian Proxy Configuration Profiles
# ========================================================

gateway:
  token_ttl_seconds: 600

logging:
  log_directory: "logs" 
  log_filename_pattern: "jovian-shield-{date}-{name}.jsonl"
  log_base_name: "prod"

security:
  master_api_key: "sec_gateway_secret_abc123"

detectors:
  email_scanner_enabled: true
  credit_card_scanner_enabled: true
  infrastructure_scanner_enabled: true
